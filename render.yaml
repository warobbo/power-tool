services:
  - type: web
    runtime: static
    name: power-tools
    staticPublishPath: .
    # HTTP 301s to the hub. Render applies these only from a synced Blueprint
    # or from the power-tool service: Dashboard → Redirects/Rewrites.
    # Git auto-deploy publishes files; it does not apply these routes.
    # A rule is skipped when a file exists at that path. The HTML stubs,
    # robots.txt, sitemap, and calculator assets are gone, so /, the
    # calculator paths, and /* return the dashboard 301 instead of 200.
    # Live hostname is power-tool.onrender.com (service name power-tool).
    # Do not rename this service here. The custom domain stays in the Dashboard.
    routes:
      - type: redirect
        source: /index.html
        destination: https://motorhometools.co.uk/power/
      - type: redirect
        source: /battery.html
        destination: https://motorhometools.co.uk/power/battery.html
      - type: redirect
        source: /solar.html
        destination: https://motorhometools.co.uk/power/solar.html
      - type: redirect
        source: /inverter.html
        destination: https://motorhometools.co.uk/power/inverter.html
      - type: redirect
        source: /wire.html
        destination: https://motorhometools.co.uk/power/wire.html
      - type: redirect
        source: /
        destination: https://motorhometools.co.uk/power/
      - type: redirect
        source: /*
        destination: https://motorhometools.co.uk/power/
    # Header rules do not publish files, so they do not block the 301s.
    # They apply only after a Blueprint sync. X-Robots-Tag covers any path
    # that still has a file (README, this Blueprint, _redirects, tests).
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
