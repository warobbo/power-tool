services:
  - type: web
    runtime: static
    name: power-tools
    staticPublishPath: .
    # HTTP 301s to the hub. Render applies these from a synced Blueprint or
    # from the power-tool service: Dashboard → Redirects/Rewrites.
    # A rule is skipped when a file exists at that path. The HTML stubs
    # answer 200 until they are removed after these rules are saved.
    # Live hostname is power-tool.onrender.com (service name power-tool).
    routes:
      - type: redirect
        source: /index.html
        destination: https://motorhometools.co.uk/power/
      - type: redirect
        source: /battery.html
        destination: https://motorhometools.co.uk/power/battery.html
      - type: redirect
        source: /solar.html
        destination: https://motorhometools.co.uk/power/solar.html
      - type: redirect
        source: /inverter.html
        destination: https://motorhometools.co.uk/power/inverter.html
      - type: redirect
        source: /wire.html
        destination: https://motorhometools.co.uk/power/wire.html
      - type: redirect
        source: /
        destination: https://motorhometools.co.uk/power/
      - type: redirect
        source: /*
        destination: https://motorhometools.co.uk/power/
    # Same Cache-Control as the published _headers file. Render's default
    # static header lets a shared cache keep HTML for five minutes.
    # must-revalidate stops that window on the redirect stubs.
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
